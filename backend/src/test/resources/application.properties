spring.datasource.url=jdbc:h2:mem:paperly-test;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

jwt.secret=test-secret-key-that-is-at-least-32-bytes-long
jwt.expiration-ms=3600000

app.seed-admin.username=test-admin
app.seed-admin.password=test-admin-password
app.seed-faculty.username=test-faculty
app.seed-faculty.password=test-faculty-password
