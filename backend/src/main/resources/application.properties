server.port=2715

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/paperly}
spring.datasource.username=${DB_USERNAME:paperly_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.seed-admin.username=${PAPERLY_ADMIN_USERNAME:admin}
app.seed-admin.password=${PAPERLY_ADMIN_PASSWORD:Micro@tek1}
app.seed-faculty.username=${PAPERLY_FACULTY_USERNAME:faculty}
app.seed-faculty.password=${PAPERLY_FACULTY_PASSWORD:Micro@tek1}
